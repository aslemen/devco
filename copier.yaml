# ======
# Copier settings
# ======
_subdirectory: src
_exclude:
  - _devco_*
# ======
# Questions
# ======
global_projectName:
  type: str
  qmark: "🌐"
  help: What is the name of this project?
  default: "devco/some-project"
uv:
  type: bool
  qmark: "🐍"
  help: Install uv (Python)?
  default: no
uv_pyVerList:
  type: str
  qmark: "🐍+"
  help: |
    Which versions of Python to install?
    Specify one or more versions, separated by spaces (e.g. `3.13 3.14 3.15`).
    No installation takes place when empty.
  default: "3.14"
  when: "{{ uv }}"
uv_pyVerDefault:
  type: str
  qmark: "🐍+"
  help: Default Python version? No specification when empty.
  default: "{{ uv_pyVerList.split(' ')[0] }}"
  when: "{{ uv and uv_pyVerList != '' }}"
rustup:
  type: bool
  qmark: "🦀"
  help: Install rustup (Rust)?
  default: no
dotnet:
  type: bool
  qmark: "[.NET]"
  help: Install dotnet (.NET SDK)?
  default: no
dotnet_channel:
  type: str
  qmark: "[.NET]+"
  help: |
    Which .NET release channel to install?
    Use a version number like `9.0`, or a named channel like `STS` or `LTS`.
  default: "9.0"
  when: "{{ dotnet }}"
deno:
  type: bool
  qmark: "🦖"
  help: Install deno (TypeScript)?
  default: no
fnm:
  type: bool
  qmark: "[JS]"
  help: Instal fnm (node, npm, Javascript)
  default: no
